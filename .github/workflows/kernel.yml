name: "Build Kernel"

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  build:
    name: "Kernel Build"
    runs-on: ubuntu-latest

    env:
      KERNEL_DIR: "common"
      KERNEL_REPO: "https://github.com/a4lippp/android_kernel_xiaomi_rock"
      KERNEL_BRANCH: "android12-5.10"
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "Setup workspace"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2 bc bison flex libssl-dev libelf-dev python3

      - name: "Setup swap"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: "Initialize AOSP repo and toolchains"
        run: |
          repo init -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10 --depth=1

          # Exclude kernel/common — we use our own kernel source
          mkdir -p .repo/local_manifests
          cat > .repo/local_manifests/remove-common.xml << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <manifest>
            <remove-project name="kernel/common"/>
          </manifest>
          EOF

          repo sync --optimized-fetch --prune -j$(nproc)
          rm -rf .repo

          # Download custom clang
          aria2c -x 16 -s 16 -o clang.tar.gz \
            "https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          tar -xzf clang.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
          rm -f clang.tar.gz

          rm -rf prebuilts/clang/host/linux-x86/clang-3289846
          rm -rf prebuilts/clang/host/linux-x86/clang-r450784e
          rm -rf prebuilts/clang/host/linux-x86/clang-stable

      - name: "Clone kernel source"
        run: |
          git clone --recursive --branch ${{ env.KERNEL_BRANCH }} \
            ${{ env.KERNEL_REPO }} ${{ env.KERNEL_DIR }} --depth=1

          sed -i \
            -e 's/^BRANCH=.*/BRANCH=android12-5.10/' \
            -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r547379/' \
            ${{ env.KERNEL_DIR }}/build.config.common || true

          sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' \
            ${{ env.KERNEL_DIR }}/build.config.rock || true

      - name: "Clone vendor modules"
        run: |
          # EXT_MODULES di rock.config pakai path ../vendor/mediatek/kernel_modules/...
          # jadi clone di sebelah common/ dengan nama vendor/mediatek/kernel_modules
          git clone --depth=1 \
            https://github.com/Asmodeus7999/MTK_kernel_modules \
            -b rock-u-oss \
            vendor/mediatek/kernel_modules

      - name: "Setup SukiSU-Ultra"
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main

      - name: "Configure kernel"
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          # LOCALVERSION sudah di-set di kernel/configs/rock.config
          # kita override di sini supaya pakai nama kita
          sed -i \
            -e 's/^CONFIG_LOCALVERSION=.*/CONFIG_LOCALVERSION="-alippchito!"/' \
            -e 's/^CONFIG_LOCALVERSION_AUTO=.*/CONFIG_LOCALVERSION_AUTO=n/' \
            kernel/configs/rock.config

          cat >> kernel/configs/rock.config << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_CC_OPTIMIZE_FOR_PERFORMANCE=y
          CONFIG_TCP_CONG_BBR=y
          CONFIG_TCP_CONG_WESTWOOD=y
          CONFIG_DEFAULT_WESTWOOD=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          CONFIG_KALLSYMS=y
          EOF

          echo 'KBUILD_CFLAGS += -Wno-implicit-function-declaration' >> Makefile

      - name: "Build kernel"
        run: |
          MODS="${{ env.WORK_DIR }}/vendor/mediatek/kernel_modules"
          LTO=thin \
          EXT_MODULES="${MODS}/gpu ${MODS}/met_drv_v3 ${MODS}/connectivity/common ${MODS}/connectivity/conninfra ${MODS}/connectivity/connfem ${MODS}/connectivity/wlan/adaptor ${MODS}/connectivity/wlan/core/gen4m ${MODS}/connectivity/bt/mt66xx/wmt ${MODS}/connectivity/gps/gps_stp ${MODS}/connectivity/gps/data_link/plat/v010 ${MODS}/connectivity/gps/data_link/plat/v030 ${MODS}/connectivity/gps/data_link/plat/v050 ${MODS}/connectivity/gps/gps_pwr ${MODS}/connectivity/gps/gps_scp ${MODS}/connectivity/fmradio" \
          BUILD_CONFIG=${{ env.KERNEL_DIR }}/build.config.rock \
          build/build.sh -j$(nproc)

      - name: "Package with AnyKernel3"
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 AnyKernel3

          sed -i \
            -e 's/do\.devicecheck=1/do.devicecheck=0/' \
            -e 's/^supported\.versions=.*/supported.versions=/' \
            AnyKernel3/anykernel.sh

          cp out/dist/Image AnyKernel3/Image
          find out/dist -name "*.dtb" -exec cp {} AnyKernel3/ \; 2>/dev/null || true

          cd AnyKernel3
          zip -r9 "../kernel-rock-SukiSU.zip" * -x .git/\*

      - name: "Upload to GitHub Release"
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        with:
          tag_name: "rock-next"
          files: kernel-rock-SukiSU.zip